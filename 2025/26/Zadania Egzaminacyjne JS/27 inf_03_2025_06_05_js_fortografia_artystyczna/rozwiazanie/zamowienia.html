<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Fotografia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Fotografia artystyczna</h1>
</header>

<nav id="obrazy">
    <img src="1.jpg" alt="obrazy do sprzedaży" title="1.jpg">
    <img src="2.jpg" alt="obrazy do sprzedaży" title="2.jpg">
    <img src="3.jpg" alt="obrazy do sprzedaży" title="3.jpg">
    <img src="4.jpg" alt="obrazy do sprzedaży" title="4.jpg">
    <img src="5.jpg" alt="obrazy do sprzedaży" title="5.jpg">
    <img src="6.jpg" alt="obrazy do sprzedaży" title="6.jpg">
    <img src="7.jpg" alt="obrazy do sprzedaży" title="7.jpg">
    <img src="8.jpg" alt="obrazy do sprzedaży" title="8.jpg">
    <img src="9.jpg" alt="obrazy do sprzedaży" title="9.jpg">
    <img src="10.jpg" alt="obrazy do sprzedaży" title="10.jpg">
</nav>

<nav id="bg">
    <section id="secL">
        <h3>Zamówienie</h3>
            <label>
                Wybierz obraz:
                <input type="file" id="plik" accept="image/jpeg" />
                <br>
            Liczba Kopii:
                <input type="number" id="ilosc"> <br>
                <input type="radio" name="papier" value="papier_blyszczacy" checked> Papier błyszczący <br>
                <input type="radio" name="papier" value="papier_matowy"> Papier matowy <br>
            </label>
            <button id="btn">Dodaj do koszyka</button>
    </section>

    <nav id="bn">
        <ul>
            <li><a href="regulamin.html">Regulamin</a></li>
            <li><a href="uslugi.html">Uslugi</a></li>
            <li><a href="https://pixabay.com ">Zdjęcia</a></li>
        </ul>
    </nav>

    <section id="secR">
        <h3>Koszyk</h3>
        <script>
            const btn = document.getElementById('btn');
            const prawaSekcja = document.getElementById('secR');

            btn.addEventListener('click', function () {

                const file = document.getElementById("plik").files[0];
                const ilosc = Number(document.getElementById('ilosc').value);

                const radio = document.querySelector('input[type="radio"]:checked').value;

                let cena = 0;

                if (radio === 'papier_blyszczacy') {
                    cena = ilosc * 1.5;
                } else {
                    cena = ilosc * 2;
                }

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.alt = 'zamowienie';

                const pKopie = document.createElement('p');
                pKopie.textContent = `Liczba kopii: ${ilosc}`;

                const pCena = document.createElement('p');
                pCena.textContent = `Cena: ${cena} zł`;

                prawaSekcja.appendChild(img);
                prawaSekcja.appendChild(pKopie);
                prawaSekcja.appendChild(pCena);
            });
        </script>
    </section>
</nav>

<footer>
    <p>Autor strony: <em>Jakub Piniężny 3p</em></p>
</footer>



</body>
</html>
